name: Browser checks & Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser & offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:subpath
      - run: node make-standalone.mjs
      - run: npm run test:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Roadster-Ligue-offline
          path: Roadster-Ligue.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    name: Publish browser game
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: browser
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
